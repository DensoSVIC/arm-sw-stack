---
header:
  version: 16
  includes:
    - repo: meta-cassini
      file: kas/cassini.yml
    - repo: meta-arm
      file: kas/fvp-rd-kronos.yml
    - yocto/kas/ref-stack-pinned-repos.yml

defaults:
  repos:
    branch: nanbield

repos:
  meta-cassini:
    url: https://gitlab.com/Linaro/cassini/meta-cassini
    path: layers/meta-cassini
    branch: nanbield-dev
    layers:
      meta-cassini-distro:
      meta-cassini-bsp: excluded

  kronos:
    layers:
      yocto/meta-kronos:

  meta-arm:
    url: >-
      https://gitlab.arm.com/automotive-and-industrial/kronos-ref-stack/meta-arm
    path: layers/meta-arm
    layers:
      meta-arm: included
      meta-arm-toolchain: included
      meta-arm-bsp: included

  meta-zephyr:
    url: https://git.yoctoproject.org/git/meta-zephyr
    path: layers/meta-zephyr
    layers:
      meta-zephyr-core:

env:
  TESTIMAGE_AUTO:
  SVE_DISABLE_FLAG:

local_conf_header:
  meta-kronos-error-qa: |
    ERROR_QA:layer-meta-kronos:append = " patch-status"
  cassini: |
    CASSINI_GENERIC_ARM64_FILESYSTEM = "0"
    DISTRO_FEATURES:append = " ipv6"
    DISTRO_FEATURES:remove = "k3s"
    KERNEL_CLASSES:remove = "k3s_kernelcfg_check"
  kronos-extra-features: |
    EXTRA_IMAGE_FEATURES:append = " actuation"
  diskmon: |
    BB_DISKMON_DIRS = "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"

distro: cassini
