---
header:
  version: 16
  includes:
    - yocto/kas/base.yml

repos:
  sw-ref-stack:
    layers:
      yocto/meta-arm-bsp-extras:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:
    patches:
      0001-arm-lib-Handle-timeout-for-spawn-object-on-stop.patch:
        repo: sw-ref-stack
        path: "yocto/kas/patches/meta-arm/\
          0001-arm-lib-Handle-timeout-for-spawn-object-on-stop.patch"

  meta-openembedded:
    layers:
      meta-python:

  meta-ptx:
    url: https://github.com/pengutronix/meta-ptx
    path: layers/meta-ptx

env:
  ARM_FVP_EULA_ACCEPT:
  DISPLAY:
  FVP_BUILD_NUMBER:
  FVP_OVERRIDE:
  FVP_SERVER_KEY:
  FVP_SERVER_URL:
  FVP_SERVER_USER:
  SVE_DISABLE_FLAG: "0"
  WAYLAND_DISPLAY:
  XAUTHORITY:

local_conf_header:
  base: |
    EXTRA_IMAGE_FEATURES:append = " debug-tweaks ssh-server-openssh"
    CORE_IMAGE_EXTRA_INSTALL:append = " ssh-pregen-hostkeys"
    LICENSE_FLAGS_ACCEPTED:append = " \
      ${@oe.utils.vartrue('ARM_FVP_EULA_ACCEPT', 'Arm-FVP-EULA', '', d)}"
    IMAGE_CLASSES += "testimage"

distro: nodistro
