---
header:
  version: 16
  includes:
    - repo: meta-ewaol
      file: kas/ewaol.yml
    - yocto/kas/arm-safety-island.yml

repos:
  meta-ewaol:
    url: https://gitlab.com/soafee/ewaol/meta-ewaol
    path: layers/meta-ewaol

  sw-ref-stack:
    layers:
      yocto/meta-arm-auto-solutions:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: layers/meta-arm
    layers:
      meta-arm: included
      meta-arm-toolchain: included

env:
  TESTIMAGE_AUTO:
  SVE_DISABLE_FLAG:

local_conf_header:
  cassini: |
    CASSINI_GENERIC_ARM64_FILESYSTEM = "0"
    DISTRO_FEATURES:remove = "cassini-security"
    DISTRO_FEATURES:append = " cassini-dev"
    KERNEL_CLASSES:remove = "containers_kernelcfg_check"
