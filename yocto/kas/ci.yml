---
header:
  version: 14

env:
  ARMLMD_LICENSE_FILE:
  ARTIFACTORY_URL:
  ARTIFACTORY_USER:
  ARTIFACTORY_KEY:
  SRC_URI_ACTUATION:
  SRCREV_ACTUATION:
  TESTIMAGE_AUTO: "1"

local_conf_header:
  ci: |
    BB_PRESSURE_MAX_CPU = "1"
    BB_PRESSURE_MAX_MEMORY = "1"
    BB_PRESSURE_MAX_IO = "1"
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE_ITEMS:append = " testimage"
