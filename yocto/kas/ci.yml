---
header:
  version: 16

env:
  ARMLMD_LICENSE_FILE:
  ARTIFACTORY_URL:
  ARTIFACTORY_USER:
  ARTIFACTORY_KEY:
  FVP_BUILD_NUMBER:
  MIRROR_DOCKER:
  SRC_URI_ACTUATION:
  SRCREV_ACTUATION:
  SRC_URI_CAM:
  SRCREV_CAM:
  TESTIMAGE_AUTO: "${@ '1' if '${BUILD_ARCH}' == 'x86_64' \
    or '${FREQUENCY}' != 'adhoc' \
    or bb.utils.contains('EXTRA_IMAGE_FEATURES', 'baremetal', True, False, d) \
    else ''}"
  FREQUENCY:

local_conf_header:
  ci: |
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE_ITEMS:append = " testimage"
    TEST_OVERALL_TIMEOUT = "${@60*60 if d.getVar('FREQUENCY') == 'adhoc' \
      else ''}"
