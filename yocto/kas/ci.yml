---
header:
  version: 14

env:
  ARMLMD_LICENSE_FILE:
  ARTIFACTORY_URL:
  ARTIFACTORY_USER:
  ARTIFACTORY_KEY:
  MIRROR_DOCKER:
  SRC_URI_ACTUATION:
  SRCREV_ACTUATION:
  TESTIMAGE_AUTO: "${@ '1' if '${BUILD_ARCH}' == 'x86_64' \
    or '${FREQUENCY}' != 'adhoc' \
    or bb.utils.contains('EXTRA_IMAGE_FEATURES', 'baremetal', True, False, d) \
    else ''}"
  FREQUENCY:

local_conf_header:
  ci: |
    BB_PRESSURE_MAX_CPU = "1"
    BB_PRESSURE_MAX_MEMORY = "1"
    BB_PRESSURE_MAX_IO = "1"
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE_ITEMS:append = " testimage"
    TEST_OVERALL_TIMEOUT = "${@40*60 if d.getVar('FREQUENCY') == 'adhoc' \
      else ''}"
