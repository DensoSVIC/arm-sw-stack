---
header:
  version: 16
  includes:
    - repo: meta-arm
      file: kas/arm-systemready-ir-acs.yml
    - yocto/kas/secure-sign.yml

# Following patches are applied for running the SIE SCT extension of the
# SystemReady IR ACS
repos:
  meta-arm:
    patches:
      enable-acs-sie-1:
        repo: sw-ref-stack
        path: "yocto/kas/patches/meta-arm-systemready/\
          0001-Enable-SIE-SCT-extension-of-ACS.patch"
      enable-acs-sie-2:
        repo: sw-ref-stack
        path: "yocto/kas/patches/meta-arm-systemready/\
          0002-Support-the-parsing-of-SIE-result.patch"
      enable-acs-sie-3:
        repo: sw-ref-stack
        path: "yocto/kas/patches/meta-arm-systemready/\
          0003-Documentation-Enable-SIE-extension.patch"
      create-fw-uefi-sniff-log:
        repo: sw-ref-stack
        path: "yocto/kas/patches/meta-arm-systemready/\
          0004-arm-systemready-Create-fw-and-uefi-sniff.log-in-ACS-.patch"

local_conf_header:
  arm-systemready-ir-acs: |
    TMPDIR = "${TOPDIR}/tmp_systemready"
