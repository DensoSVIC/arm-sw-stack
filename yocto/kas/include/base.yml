---
header:
  version: 13
  includes:
    - repo: meta-arm
      file: kas/fvp-rd-kronos.yml

defaults:
  repos:
    refspec: langdale

repos:
  kronos:
    layers:
      yocto/meta-kronos:

  meta-arm:
    url: https://git.yoctoproject.org/git/meta-arm
    path: layers/meta-arm

env:
  TESTIMAGE_AUTO:

local_conf_header:
  diskmon: |
    BB_DISKMON_DIRS = "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
