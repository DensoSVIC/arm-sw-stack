---
header:
  version: 13
  includes:
    - repo: meta-arm
      file: kas/fvp-rd-kronos.yml

defaults:
  repos:
    refspec: langdale

repos:
  kronos:
    layers:
      yocto/meta-kronos:

  meta-arm:
    url: https://git.yoctoproject.org/git/meta-arm
    path: layers/meta-arm

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    path: layers/meta-virtualization
    layers:
      .: excluded

  meta-zephyr:
    url: https://git.yoctoproject.org/git/meta-zephyr
    path: layers/meta-zephyr
    layers:
      meta-zephyr-core:

  meta-security:
    url: https://git.yoctoproject.org/git/meta-security
    path: layers/meta-security
    patches:
      packageconfig-fix:
        repo: kronos
        path: "yocto/kas/patches/\
               0001-Fix-PACKAGECONFIG-check-in-Parsec-OEQA-tests.patch"
      cache-fix:
        repo: kronos
        path: "yocto/kas/patches/\
              0002-meta-parsec-master-langdale-PATCH-Flush-caches-after.patch"
    layers:
      meta-parsec:

  meta-clang:
    url: https://github.com/kraj/meta-clang
    path: layers/meta-clang

env:
  TESTIMAGE_AUTO:

local_conf_header:
  diskmon: |
    BB_DISKMON_DIRS = "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
