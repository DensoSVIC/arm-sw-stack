---
header:
  version: 13
  includes:
    - repo: meta-cassini
      file: meta-cassini-config/kas/cassini.yml

repos:
  meta-cassini:
    url: https://gitlab.com/Linaro/cassini/meta-cassini
    path: layers/meta-cassini
    refspec: langdale-dev
    layers:
      meta-cassini-distro:
      meta-cassini-bsp: excluded

local_conf_header:
  cassini: |
    CASSINI_GENERIC_ARM64_FILESYSTEM = "0"
    DISTRO_FEATURES:remove = "k3s"
    KERNEL_CLASSES:remove = "k3s_kernelcfg_check"
    INIT_MANAGER:fvp-rd-kronos = "sysvinit"
    INIT_MANAGER:generic-arm64 = "sysvinit"
