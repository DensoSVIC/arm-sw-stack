---
header:
  version: 14
  includes:
    - yocto/kas/base.yml

env:
  DOMU1_MEMORY_SIZE: ""
  DOMU1_VCPUS: ""
  DOMU2_MEMORY_SIZE: ""
  DOMU2_VCPUS: ""

local_conf_header:
  virtualization: |
    DISTRO_FEATURES:append = " xen ptest"
    EXTRA_IMAGE_FEATURES:append = " virtualization"
    PTEST_ENABLED:pn-elfutils = "0"
    TMPDIR = "${TOPDIR}/tmp_virtualization"
    DOMU_TMPDIR = "${TOPDIR}/tmp_virtualization_domu"
    DOMU_MACHINE = "generic-arm64"
    BBMULTICONFIG += "domu"

target:
  - virtualization-image
