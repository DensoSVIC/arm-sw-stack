# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-arm-bsp-extras"
BBFILE_PATTERN_meta-arm-bsp-extras = "^${LAYERDIR}/"

LAYERDEPENDS_meta-arm-bsp-extras = "\
    core \
    meta-arm \
    meta-python \
    ptx \
    "
LAYERSERIES_COMPAT_meta-arm-bsp-extras = "scarthgap"
