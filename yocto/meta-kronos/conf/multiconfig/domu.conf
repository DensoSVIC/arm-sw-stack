MACHINE = "${DOMU_MACHINE}"
MACHINE_FEATURES:remove = "rtc"

EXTRA_IMAGE_FEATURES:remove = "virtualization"
EXTRA_IMAGE_FEATURES:append = " domu"

# QEMU is only used to generate qcow2 images, so remove unneeded items from its
# PACKAGECONFIG
PACKAGECONFIG:remove:pn-qemu-system-native = "alsa virglrenderer epoxy"

# Xen guests uses console hvc0
SERIAL_CONSOLES = "115200;hvc0"

# Use a separate TMPDIR
TMPDIR = "${DOMU_TMPDIR}"

# Prepend the local wic directory to the wks search path
WKS_SEARCH_PATH:prepend := "${KRONOS_VIRTUALIZATION_DYNAMIC_DIR}/wic:"

# Don't include kernel binary in rootfs /boot path
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base =""

# DomU is booted/started by Dom0, hence we don't need an EFI loader for it
EFI_PROVIDER = ""
