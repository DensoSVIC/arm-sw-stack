# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

KRONOS_VIRTUALIZATION_DYNAMIC_DIR := "${LAYERDIR}/dynamic-layers/virtualization-layer"
BBFILES_DYNAMIC += " \
    virtualization-layer:${KRONOS_VIRTUALIZATION_DYNAMIC_DIR}/*/*/*.bb \
    virtualization-layer:${KRONOS_VIRTUALIZATION_DYNAMIC_DIR}/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-kronos"
BBFILE_PATTERN_meta-kronos = "^${LAYERDIR}/"

LAYERDEPENDS_meta-kronos = "core meta-arm-bsp"
LAYERSERIES_COMPAT_meta-kronos = "langdale"

# In this layer we are using Xen without the virtualization DISTRO_FEATURE
SKIP_META_VIRT_SANITY_CHECK = "1"

# Apply image features configurations
USER_CLASSES:append = " fvp_rd_kronos_image_features"
