---
version: "2"
plugins:
  duplication:
  structure:
  pep8:
    enabled: true
  sonar-python:
    enabled: true
  shellcheck:
    enabled: true
    file_types:
      - "bash script"
      - "bats script"
      - "shell script"
  fixme:
    enabled: true
    exclude_patterns:
      - "/Dangerfile"
  cspell:
    enabled: true
    exclude_patterns:
      - GITIGNORE_CONTENTS
      - ".gitignore"
      - ".gitlab"
      - ".csslintrc"
      - ".eslintignore"
      - "coffeelint.json"
      - ".eslintrc.yml"
      - ".rubocop.yml"
      - "**.patch"
      - "**.svg"
    dict_path: ".dictionary"
  yamllint:
    enabled: true
    exclude_patterns:
      - ".eslintrc.yml"
      - ".rubocop.yml"
  headercheck:
    enabled: true
    format_rule: format-1
    original_works_licenses:
      - "Apache-2.0"
      - "GPL-2.0-only"
      - "MIT"
    external_works_licenses:
      - "MIT"
    exclude_patterns:
      - GITIGNORE_CONTENTS
      - "*.cfg"
      - "*.css"
      - "*.git"
      - "*.gitignore"
      - "*.log"
      - "*.patch"
      - "*.png"
      - "*.scc"
      - "*.svg"
      - "*__init__.py"
      - ".csslintrc"
      - ".eslintignore"
      - ".eslintrc.yml"
      - ".gitlab"
      - ".rubocop.yml"
      - "/license.rst"
      - "coffeelint.json"
