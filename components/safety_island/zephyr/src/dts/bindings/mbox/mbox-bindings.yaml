---
description: Mbox Bindings

compatible: "pc-mbox-rpmsg-binding"

include: base.yaml

properties:
  mboxes:
    description: phandle to the MBOX controller (TX and RX are required)
    required: true

  mbox-names:
    description: MBOX channel names (must be called "tx" and "rx")
    required: true
