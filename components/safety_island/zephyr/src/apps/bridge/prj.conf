CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ETHERNET_BRIDGE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_PROMISCUOUS_MODE=y

CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=2048

CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_NET_IFACE1_BRIDGE=y
CONFIG_NET_IFACE3_BRIDGE=y
CONFIG_NET_IFACE4_BRIDGE=y

CONFIG_NET_IFACE2_ADDR="192.168.0.1"
CONFIG_NET_IFACE2_NETMASK="255.255.255.0"
CONFIG_NET_IFACE2_VLAN=100
