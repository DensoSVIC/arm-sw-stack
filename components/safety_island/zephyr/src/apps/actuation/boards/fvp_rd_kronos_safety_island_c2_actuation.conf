CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_IPC_RPMSG_VETH_SI_IPV4_ADDR_0=""
CONFIG_IPC_RPMSG_VETH_SI_NETMASK_0=""

CONFIG_NET_IFACE1_ADDR="192.168.2.1"
CONFIG_NET_IFACE1_NETMASK="255.255.255.0"
CONFIG_NET_IFACE1_VLAN=300

CONFIG_NET_IFACE2_ADDR="192.168.10.2"
CONFIG_NET_IFACE2_GW="192.168.10.254"
CONFIG_NET_IFACE2_NETMASK="255.255.255.0"

CONFIG_DDS_NETWORK_INTERFACE="veth_rpmsg"

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8196
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=8196

# Work around a bug appearing when multiple cores are used
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
