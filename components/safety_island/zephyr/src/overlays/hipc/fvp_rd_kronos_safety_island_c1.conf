CONFIG_IPM=y
CONFIG_IPM_MHUV3=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_VETH_MAC_ADDR="00:01:02:03:04:06"
CONFIG_VETH_NS_NAME="ethsi1"

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=256000
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=4000
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n

CONFIG_SHELL_STACK_SIZE=16000

CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_RX_COUNT=1
CONFIG_NET_TC_TX_COUNT=1

CONFIG_NET_TCP_PKT_ALLOC_TIMEOUT=200
CONFIG_NET_RX_STACK_SIZE=32000
CONFIG_NET_TX_STACK_SIZE=32000
CONFIG_ISR_STACK_SIZE=32000

CONFIG_VETH_RPMSG=y

# configure network
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.2"
# Do not use ipv6 address, explicitly turn off ipv6
CONFIG_NET_IPV6=n

# Workaround: Make the shell not need a newline to show the prompt
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SHELL_MINIMAL=y
