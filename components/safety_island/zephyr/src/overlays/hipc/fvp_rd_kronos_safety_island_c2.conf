CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y

CONFIG_IPC_RPMSG_VETH=y
CONFIG_IPC_RPMSG_VETH_COUNT=2
CONFIG_IPC_RPMSG_VETH_DRV_NAME="ipc_rpmsg_veth"

CONFIG_IPC_RPMSG_VETH_EPT_NAME_0="ipc_rpmsg_veth_cl0_cl2"
CONFIG_IPC_RPMSG_VETH_MAC_ADDR_0="00:01:02:03:04:0C"
CONFIG_IPC_RPMSG_VETH_SI_IPV4_ADDR_0="192.168.4.2"
CONFIG_IPC_RPMSG_VETH_SI_NETMASK_0="255.255.255.0"

CONFIG_IPC_RPMSG_VETH_EPT_NAME_1="ipc_rpmsg_veth_cl1_cl2"
CONFIG_IPC_RPMSG_VETH_MAC_ADDR_1="00:01:02:03:04:0D"
CONFIG_IPC_RPMSG_VETH_SI_IPV4_ADDR_1="192.168.5.2"
CONFIG_IPC_RPMSG_VETH_SI_NETMASK_1="255.255.255.0"

CONFIG_MBOX=y
CONFIG_MBOX_MHUV3=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_VETH_MAC_ADDR="00:01:02:03:04:07"
CONFIG_VETH_NS_NAME="ethsi2"

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=256000
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=4000
CONFIG_OPENAMP_RSC_TABLE=y

CONFIG_SHELL_STACK_SIZE=16000

CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_RX_COUNT=1
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_VLAN=y
CONFIG_NET_VLAN_COUNT=1

CONFIG_NET_TCP_PKT_ALLOC_TIMEOUT=200
CONFIG_NET_RX_STACK_SIZE=32000
CONFIG_NET_TX_STACK_SIZE=32000
CONFIG_ISR_STACK_SIZE=32000

CONFIG_VETH_RPMSG=y

# configure network
CONFIG_NET_IF_MAX_IPV4_COUNT=3
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.2.2"
CONFIG_NET_CONFIG_MY_VLAN_ID=300
# Do not use ipv6 address, explicitly turn off ipv6
CONFIG_NET_IPV6=n

CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=2048
