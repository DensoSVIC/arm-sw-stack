CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_GPTP=y
CONFIG_NET_CONTEXT_PRIORITY=y
# Zephyr needs at least 4 TX traffic classes in order to have dedicated ones for
# normal traffic, PTP general messages and PTP event messages.
CONFIG_NET_TC_TX_COUNT=4
# Zephyr needs at least 2 RX traffic classes in order to have dedicated ones for
# normal traffic and PTP messages.
CONFIG_NET_TC_RX_COUNT=2

# Use Zephyr as PTP client only
CONFIG_NET_GPTP_GM_CAPABLE=n

# The POSIX interface is used for software timestamping
CONFIG_POSIX_API=y

# 100MHz system counter
# For a tickless kernel, this only affects the time resolution
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000000

CONFIG_DATE_SHELL=y

# Increase the stack size in order to work with LOG_MODE_IMMEDIATE
CONFIG_NET_GPTP_STACK_SIZE=4096

# Keep the PTP synchronization even in case of high network or thread activity
# in the system. This is needed because of software timestamping.
CONFIG_NET_GPTP_NEIGHBOR_PROP_DELAY_THR=1000000
