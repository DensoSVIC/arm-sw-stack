CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=256000

CONFIG_SHELL_STACK_SIZE=16000

CONFIG_NET_RX_STACK_SIZE=32000
CONFIG_NET_TX_STACK_SIZE=32000
CONFIG_ISR_STACK_SIZE=32000

CONFIG_MDIO=y
CONFIG_MDIO_SHELL=n
CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82

CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.254"
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
# Do not use ipv6 address, explicitly turn off ipv6
CONFIG_NET_IPV6=n
