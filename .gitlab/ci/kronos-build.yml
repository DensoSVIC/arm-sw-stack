---

# Modify the yocto/kas base build with specific settings
.yocto_base:
  variables:
    CACHE_DIR: /sstate-cache
    SSTATE_DIR: $CACHE_DIR/$PROJECT_VERSION/yocto-sstate
    DL_DIR: $CACHE_DIR/$PROJECT_VERSION/yocto-downloads
    TOOLCHAIN_DIR: $CACHE_DIR/$PROJECT_VERSION/toolchains

.kas_build:
  image: ${MIRROR_GHCR}/siemens/kas/kas:3.3
  variables:
    KAS_REPO_REF_DIR: $CACHE_DIR/$PROJECT_VERSION/repos
    KUBERNETES_MEMORY_REQUEST: 32Gi
    USER_ID:
    GROUP_ID:

# Extend the kas base build to enable to use of repos that are not yet public
.kas_build_kronos:
  extends:
    - .kas_build
  variables:
    IMAGE_DIR: $CACHE_DIR/$PROJECT_VERSION/images
  before_script:
    - KASFILE_CI=yocto/kas/ci.yml
    # Set the url and refspec for the specific repos
    - |
      if ! [ -z "${REPOS_META_ARM_URL}" ] &&
         ! [ -z "${REPOS_META_ARM_REFSPEC}" ]; then
      # Must be aligned with above '|'
      cat << EOF >> $KASFILE_CI
      repos:
        meta-arm:
          url: $REPOS_META_ARM_URL
          refspec: $REPOS_META_ARM_REFSPEC
      EOF
      fi
    # Set the SRCREV for the specific recipes
    - |
      if ! [ -z "${COMPONENT_NAME}" ] && ! [ -z "${COMPONENT_SRCREV}" ] &&
         ! [ -z "${COMPONENT_SRC_URI}" ]; then
      # Must be aligned with above '|'
      cat << EOF >> $KASFILE_CI;
      local_conf_header:
        ${COMPONENT_NAME}: |
          SRC_URI:pn-${COMPONENT_NAME} = "${COMPONENT_SRC_URI}"
          SRCREV:pn-${COMPONENT_NAME} = "${COMPONENT_SRCREV}"
      EOF
      fi
      cat $KASFILE_CI
    - mkdir -p ~/.ssh
    - eval "$(ssh-agent -s)"
    - if [ -n "${SSH_PRIVATE_GITLAB+x}" ]; then
        echo "${SSH_PRIVATE_GITLAB}" | tr -d '\r' | ssh-add - > /dev/null;
      fi
    - ssh-keyscan -t rsa ${CI_SERVER_HOST}  >> ~/.ssh/known_hosts
    # Ensure git is usable without prompts
    - git config --global url.ssh://git@${CI_SERVER_HOST}.insteadOf
        https://${CI_SERVER_HOST}
    - git config --global user.email "you@example.com"
    - git config --global user.name "Your Name"
    # Install the module required by yoctoqa-to-junit.py
    - pip3 install junit_xml
    - !reference [".kas_build", before_script]
    # Setup workspace
    - echo "Persistent cache volume could be empty, create directories required"
    - mkdir --verbose --parents
        $IMAGE_DIR
    # Infer the FVP_PV and DEPLOY_DIR for the build. Export these to be used in
    # Image-Upload. This must be done before the build in case it fails.
    - KASFILES=$(./.gitlab/scripts/jobs-to-kas "${KAS_CONFIGS}")
    - |
      export FVP_PV=\
      $(kas shell --update --force-checkout "${KASFILES}" -c \
        "bitbake-getvar --value -r fvp-rd-kronos-native PV")
    - echo "DEPLOY_DIR=${DEPLOY_DIR}" >> Image-Upload.env
    - echo "FVP_PV=${FVP_PV}" >> Image-Upload.env

.kas_image_build_kronos:
  extends: .kas_build_kronos
  parallel:
    matrix:
      - BUILD_HOST_ARCH: [arm64, x86_64]
  tags:
    - ${BUILD_HOST_ARCH}
  # Store the build artifacts from the job.
  artifacts:
    when: always
    name: "$CI_BUILD_REF_SLUG-$CI_JOB_NAME_SLUG-$CI_JOB_ID"
    paths:
      # Configs
      - $KAS_WORK_DIR/build/conf/*
      # Logs
      - $KAS_WORK_DIR/build/bitbake-cookerdaemon.log
      - $KAS_WORK_DIR/build/tmp*/log
      - $KAS_WORK_DIR/build/tmp*/work/*/*/*/temp/log.*
      - $KAS_WORK_DIR/build/tmp*/work/*/*/*/testimage
      - $KAS_WORK_DIR/build/tmp*/deploy/licenses/fvp-rd-kronos-native
      - $KAS_WORK_DIR/build/tmp*/deploy/images
    reports:
      junit:
        - TEST-autotest-${CI_JOB_NAME_SLUG}.xml
      dotenv: Image-Upload.env
    expire_in: '1 day'
  after_script:
    - python3 .gitlab/scripts/yoctoqa-to-junit.py
        "${KAS_WORK_DIR}/build/tmp*/log/cooker/*/console-latest.log"
        "TEST-autotest-${CI_JOB_NAME_SLUG}.xml"
  rules:
    - !reference [".build-image:rules", rules]

Image-Build-baremetal:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: baremetal

Image-Build-baremetal-si0-ethernet0:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: baremetal/si0-ethernet0

Image-Build-baremetal-si0-bridge-ethernet0:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: baremetal/si0-bridge-ethernet0

Image-Build-baremetal-hipc-validation:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: baremetal/hipc-validation
    DEPLOY_DIR: $CI_PROJECT_DIR/work/build/tmp_baremetal/deploy

Image-Upload:
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf:2.42.0
  stage: Release
  tags:
    - x86_64
  dependencies:
    - "Image-Build-baremetal-hipc-validation: [arm64]"
  rules:
    - if: '$GENERATE_BUILD_INFO == "true"'
      when: always
  script:
    # Upload the deploy dir images
    - |
      jf config add --interactive=false \
        --artifactory-url="${ARTIFACTORY_BASE_URL}" \
        --user="${ARTIFACTORY_USER}" --password="${ARTIFACTORY_KEY}"
    - |
      if [[ -d "${DEPLOY_DIR}" ]]; then
        TARFILE="${CI_PROJECT_DIR}/baremetal-hipc-images-${CI_PIPELINE_ID}.tgz"
        tar -zcvf "${TARFILE}" -C "${DEPLOY_DIR}/images" fvp-rd-kronos
        cat << EOF > ./upload_spec.json
      {
        "files": [
          {
            "pattern": "${TARFILE}",
            "target": "${ARTIFACTORY_ARTIFACT_PATH}/"
          }
        ]
      }
      EOF
        jf rt upload --spec=./upload_spec.json \
          --build-name="${ARTIFACTORY_IMAGE_BUILD_PATH}" \
          --build-number="${CI_PIPELINE_ID}"
      fi
    # Collect environment variables and attach them to the build
    - RECIPEINFO="${DEPLOY_DIR}/licenses/fvp-rd-kronos-native/recipeinfo"
    - |
      jf rt build-collect-env \
        "${ARTIFACTORY_IMAGE_BUILD_PATH}" "${CI_PIPELINE_ID}"
    # Publish build to Artifactory
    - |
      jf rt build-publish --build-url "${CI_PIPELINE_URL}" \
        --url "${ARTIFACTORY_BASE_URL}" --password "${ARTIFACTORY_KEY}" \
        "${ARTIFACTORY_IMAGE_BUILD_PATH}" "${CI_PIPELINE_ID}"

fvp-summary-render:
  image: ${MIRROR_DOCKER}/python:3.8
  stage: Release
  artifacts:
    paths:
      - update-report
  script:
    - rm -fr update-report
    - pip3 install -r "${CI_PROJECT_DIR}/.gitlab/scripts/requirements.txt"
    - |
      python3 "${CI_PROJECT_DIR}/.gitlab/scripts/fvp-summary.py" \
        -o "${CI_PROJECT_DIR}/update-report"
  tags:
    - arm64
  when: always

Image-Build-virtualization:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: virtualization

Image-Build-virtualization-hipc-validation:
  extends: .kas_image_build_kronos
  variables:
    KAS_CONFIGS: virtualization/hipc-validation

# Suppress the use of the gitlab/kas helper jobs as they
# should only be run in the nightly or when triggered manually
Prune-Cache:
  rules:
    - if: $FREQUENCY == "nightly"
    - when: manual

Update-Repos:
  variables:
    UPDATE_REPO_SCRIPT: "./.gitlab/scripts/update-repos.py"
