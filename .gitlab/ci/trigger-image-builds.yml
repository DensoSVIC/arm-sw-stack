---

merge_jobs:
  needs:
    - job: Build-Utility-Docker-Image
      optional: true
      artifacts: false
    - job: baremetal
      optional: true
    - job: virtualization
      optional: true
  before_script:
    - |
      cat << EOF > ${CI_JOB_FILE}
      include:
        - project: $PIPELINE_TEMPLATE_PROJECT
          ref: v$PIPELINE_TEMPLATE_VERSION
          file:
            - gitlab-ci/common_gitlab-ci.yml
            - gitlab-ci/yocto-build-base_gitlab-ci.yml
            - gitlab-ci/kas-build-base_gitlab-ci.yml
        - local: .gitlab/ci/kronos-build.yml
        - local: .gitlab/ci/rules.yml
        - local: .gitlab/ci/yocto-qa.yml
      EOF

trigger_jobs:
  needs:
    - merge_jobs
    - job: Build-Utility-Docker-Image
      optional: true
      artifacts: false
