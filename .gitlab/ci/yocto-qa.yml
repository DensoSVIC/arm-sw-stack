---

# Validate layers are Yocto Project Compatible
check-layers:
  extends: .kas_build_kronos
  script:
    - echo "Validate layer $LAYER is Yocto Project compatible"
    # There is bug in Python 3.9.2 which is causing yocto-check-layer to fail
    # https://github.com/python/cpython/issues/88600
    # The LD_PRELOAD can be removed when Kas moves to a newer version of Python
    - kas shell --update --force-checkout
        yocto/kas/virtualization.yml:.gitlab/kas/ci.yml
        --command
          "LD_PRELOAD=/lib/aarch64-linux-gnu/libgcc_s.so.1
            yocto-check-layer-wrapper
            $CI_PROJECT_DIR/yocto/$LAYER
            --dependency
              $KAS_WORK_DIR/layers/meta-arm/meta-arm
              $KAS_WORK_DIR/layers/meta-arm/meta-arm-bsp
              $KAS_WORK_DIR/layers/meta-arm/meta-arm-toolchain
              $KAS_WORK_DIR/layers/meta-cassini/meta-cassini-distro
              $KAS_WORK_DIR/layers/meta-clang
              $KAS_WORK_DIR/layers/meta-openembedded/meta-filesystems
              $KAS_WORK_DIR/layers/meta-openembedded/meta-networking
              $KAS_WORK_DIR/layers/meta-openembedded/meta-oe
              $KAS_WORK_DIR/layers/meta-openembedded/meta-python
              $KAS_WORK_DIR/layers/meta-security/meta-parsec
              $KAS_WORK_DIR/layers/meta-virtualization
              $KAS_WORK_DIR/layers/meta-zephyr/meta-zephyr-core
              $KAS_WORK_DIR/layers/poky/meta
              $KAS_WORK_DIR/layers/poky/meta-poky
            --no-auto-dependency"
  parallel:
    matrix:
      - MACHINE: fvp-rd-kronos
        LAYER: [meta-kronos]

  variables:
    TESTIMAGE_AUTO: "0"

  rules:
    - !reference [".layer-check:rules", rules]
