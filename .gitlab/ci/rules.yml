---
# Conditions
.if-merge-request-or-push: &if-merge-request-or-push
  if: '$CI_MERGE_REQUEST_IID || $CI_PIPELINE_SOURCE == "push"'

.if-scheduled-or-manual: &if-scheduled-or-manual
  if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'

.if-api-or-pipeline: &if-api-or-pipeline
  if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "pipeline"'

.if-nightly: &if-nightly
  if: '$FREQUENCY == "nightly"'

.if-weekly: &if-weekly
  if: '$FREQUENCY == "weekly"'

# Changes patterns
.ci-patterns: &ci-patterns
  - ".gitlab-ci.yml"
  - ".gitlab/Dockerfiles/**/*"
  - ".gitlab/ci/docker-image-builds.yml"
  - ".gitlab/ci/kronos-build.yml"
  - ".gitlab/ci/kronos-image-builds.yml"
  - ".gitlab/ci/rules.yml"
  - ".gitlab/ci/templates/image_build.yml.j2"
  - ".gitlab/ci/trigger-image-builds.yml"
  - ".gitlab/ci/yocto-qa.yml"
  - ".gitlab/scripts/**/*"

.yocto-patterns: &yocto-patterns
  - "yocto/**/*"

# Build image rules
.build-image:rules:
  rules:
    - <<: *if-scheduled-or-manual
    - <<: *if-api-or-pipeline
    - <<: *if-merge-request-or-push
      changes: *ci-patterns
    - <<: *if-merge-request-or-push
      changes: *yocto-patterns

# Layer check rules
.layer-check:rules:
  rules:
    - <<: *if-scheduled-or-manual
    - <<: *if-api-or-pipeline
    - <<: *if-merge-request-or-push
      changes: *ci-patterns
    - <<: *if-merge-request-or-push
      changes: *yocto-patterns
