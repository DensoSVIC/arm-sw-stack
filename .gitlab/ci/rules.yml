---
# Conditions
.if-scheduled-or-manual: &if-scheduled-or-manual
  if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'

.if-api-or-pipeline: &if-api-or-pipeline
  if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "pipeline"'

.if-build-enable-regex: &if-build-enable-regex
  if: '$BUILD_ENABLE_REGEX != null && $CI_JOB_NAME !~ $BUILD_ENABLE_REGEX'
  when: never

# Changes patterns
.ci-patterns: &ci-patterns
  - ".gitlab-ci.yml"
  - ".gitlab/Dockerfiles/**/*"
  - ".gitlab/ci/kronos-build.yml"
  - ".gitlab/ci/rules.yml"
  - ".gitlab/ci/yocto-qa.yml"
  - ".gitlab/scripts/**/*"

.bsp-extras-patterns: &bsp-extras-patterns
  - "yocto/meta-arm-bsp-extras/**/*"

.arm-auto-solutions-patterns: &arm-auto-solutions-patterns
  - "yocto/meta-arm-auto-solutions/**/*"
  - "yocto/meta-arm-safety-island/**/*"

.components-patterns: &components-patterns
  - "components/**/*"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE != "push" || $RUN_PIPELINE != null'

# arm-auto-solutions build image rules
.build-arm-auto-solutions:rules:
  rules:
    - <<: *if-build-enable-regex
    - <<: *if-scheduled-or-manual
    - <<: *if-api-or-pipeline
    - changes: *ci-patterns
    - changes: *bsp-extras-patterns
    - changes: *arm-auto-solutions-patterns
    - changes: *components-patterns

# bsp-extras build image rules
.build-bsp-extras:rules:
  rules:
    - <<: *if-build-enable-regex
    - <<: *if-scheduled-or-manual
    - <<: *if-api-or-pipeline
    - changes: *ci-patterns
    - changes: *bsp-extras-patterns

# Layer check rules
.layer-check:rules:
  rules:
    - <<: *if-build-enable-regex
    - <<: *if-scheduled-or-manual
    - <<: *if-api-or-pipeline
    - changes: *ci-patterns
    - changes: *bsp-extras-patterns
    - changes: *arm-auto-solutions-patterns
