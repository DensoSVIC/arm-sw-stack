---
# Conditions
.if-merge-request-or-push: &if-merge-request-or-push
  if: '$CI_MERGE_REQUEST_IID || $CI_PIPELINE_SOURCE == "push"'

.if-scheduled-or-manual: &if-scheduled-or-manual
  if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'

.if-nightly: &if-nightly
  if: '$FREQUENCY == "nightly"'

.if-weekly: &if-weekly
  if: '$FREQUENCY == "weekly"'

# Changes patterns
.ci-patterns: &ci-patterns
  - ".gitlab-ci.yml"
  - ".gitlab/ci/docs-build.yml"
  - ".gitlab/ci/kronos-build.yml"
  - ".gitlab/ci/rules.yml"
  - ".gitlab/ci/trigger-image-builds.yml"
  - ".gitlab/ci/yocto-qa.yml"
  - ".gitlab/scripts/**/*"

.ci-docker-images-patterns: &ci-docker-images-patterns
  - ".gitlab/Dockerfiles/**/*"
  - ".gitlab/ci/docker-image-builds.yml"

.ci-kronos-patterns: &ci-kronos-patterns
  - ".gitlab/ci/kronos-image-builds.yml"

.kas-common: &kas-common
  - "yocto/kas/include/base.yml"

.kas-baremetal: &kas-baremetal
  - "yocto/kas/baremetal.yml"

# Build rules
.build-image:rules:baremetal:
  rules:
    - <<: *if-scheduled-or-manual
    - <<: *if-merge-request-or-push
      changes: *ci-patterns
    - <<: *if-merge-request-or-push
      changes: *ci-kronos-patterns
    - <<: *if-merge-request-or-push
      changes: *kas-common
    - <<: *if-merge-request-or-push
      changes: *ci-docker-images-patterns
    - <<: *if-merge-request-or-push
      changes: *kas-baremetal

.layer-check:rules:
  rules:
    - when: on_success
